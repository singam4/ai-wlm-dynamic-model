&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;ai-wlm-dynamic-model&quot;);
    if (!root) {
      return;
    }

    const svg = root.querySelector(&quot;.ai-wlm-chart&quot;);
    const detail = root.querySelector(&quot;.ai-wlm-detail&quot;);
    const calibration = root.querySelector(&#x27;[data-output=&quot;calibration&quot;]&#x27;);
    const controls = {
      scenario: root.querySelector(&#x27;[data-control=&quot;scenario&quot;]&#x27;),
      intensity: root.querySelector(&#x27;[data-control=&quot;intensity&quot;]&#x27;),
      startup: root.querySelector(&#x27;[data-control=&quot;startup&quot;]&#x27;),
      maxReplicas: root.querySelector(&#x27;[data-control=&quot;max-replicas&quot;]&#x27;),
      play: root.querySelector(&#x27;[data-control=&quot;play&quot;]&#x27;)
    };
    const outputs = {
      intensity: root.querySelector(&#x27;[data-output=&quot;intensity&quot;]&#x27;),
      startup: root.querySelector(&#x27;[data-output=&quot;startup&quot;]&#x27;),
      maxReplicas: root.querySelector(&#x27;[data-output=&quot;max-replicas&quot;]&#x27;),
      sourceNote: root.querySelector(&#x27;[data-output=&quot;source-note&quot;]&#x27;)
    };

    const totalSeconds = 180;
    const slotsPerReplica = 8;
    const maxWaitSeconds = 75;
    const memPerReplica = 12.5;
    const modes = [
      { key: &quot;static&quot;, label: &quot;No DLL&quot;, note: &quot;fixed capacity&quot; },
      { key: &quot;reactive&quot;, label: &quot;Reactive DLL&quot;, note: &quot;wait, then scale&quot; },
      { key: &quot;cold_ai&quot;, label: &quot;AI DLL, Global Prior&quot;, note: &quot;conservative prior + live shape&quot; },
      { key: &quot;learned_ai&quot;, label: &quot;AI DLL, Local Learning&quot;, note: &quot;pre-warm + right-size routing&quot; }
    ];
    const observedSample = {
      window: &quot;Observe 60d DaaS prod EMS probe, daily-bucketed and normalized to 180s&quot;,
      emsWaiterLogs: 8428582,
      emsCreateSubEngineLogs: 6233592,
      emsDeleteSubEngineLogs: 7028407,
      emsDecommissioningLogs: 4516858,
      emsFailureLogs: 51093,
      emsErrorLogs: 541852,
      emsDailyAverageCategoryLogs: 1064471,
      emsDailyPeakCategoryLogs: 2173116,
      startupWindow: &quot;Observe 30d prod EMS successful sub-engine/replica creates&quot;,
      startupStarts: 79126,
      startupP50Seconds: 48,
      startupP95Seconds: 127,
      startupP99Seconds: 140,
      demandScaleCreates: 78881,
      demandScaleP50Seconds: 48,
      demandScaleP95Seconds: 126,
      demandScaleP99Seconds: 140,
      otherCreates: 245,
      otherP50Seconds: 54,
      otherP95Seconds: 127,
      otherP99Seconds: 155
    };
    const scenarioMeta = {
      observe: { peak: 74, aiNeed: 3.4, readyBeforePeak: 28 },
      dashboard: { peak: 62, aiNeed: 2.0, readyBeforePeak: 22 },
      etl: { peak: 64, aiNeed: 3.0, readyBeforePeak: 26 },
      joins: { peak: 62, aiNeed: 4.0, readyBeforePeak: 28 },
      shape: { peak: 110, aiNeed: 3.2, readyBeforePeak: 24 }
    };

    let model = null;
    let currentSecond = 0;
    let playing = true;
    let timer = null;

    function hash(seed) {
      const x = Math.sin(seed * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }

    function gaussian(t, center, width) {
      const d = (t - center) / width;
      return Math.exp(-0.5 * d * d);
    }

    function countFromRate(rate, seed) {
      const whole = Math.floor(rate);
      return whole + (hash(seed) &lt; rate - whole ? 1 : 0);
    }

    function makeQuery(id, arrival, kind, scenario) {
      const r = hash(id * 7 + arrival * 13);
      const joinHeavy = scenario === &quot;joins&quot; || (scenario === &quot;shape&quot; &amp;&amp; arrival &gt; 85);
      if (scenario === &quot;observe&quot;) {
        const duration = kind === &quot;cheap&quot; ? 3 + Math.floor(r * 5) : 34 + Math.floor(r * 46);
        const memory = kind === &quot;cheap&quot; ? 0.9 + r * 0.4 : 3.7 + r * 1.8;
        return { id, arrival, kind, duration, memory };
      }
      const duration =
        kind === &quot;cheap&quot;
          ? 2 + Math.floor(r * 5)
          : (joinHeavy ? 42 : 26) + Math.floor(r * (joinHeavy ? 48 : 34));
      const memory = kind === &quot;cheap&quot; ? 0.8 + r * 0.5 : (joinHeavy ? 4.2 : 3.1) + r * 1.4;
      return { id, arrival, kind, duration, memory };
    }

    function generateWorkload(scenario, intensity) {
      const workload = Array.from({ length: totalSeconds + 1 }, () =&gt; []);
      let id = 1;
      for (let t = 0; t &lt;= totalSeconds; t++) {
        let cheapRate = 0.12;
        let heavyRate = 0.015;
        if (scenario === &quot;observe&quot;) {
          const waiterPressure = observedSample.emsWaiterLogs / observedSample.emsCreateSubEngineLogs;
          const churnPressure = observedSample.emsDeleteSubEngineLogs / observedSample.emsCreateSubEngineLogs;
          const failurePressure = Math.min(
            1.5,
            (observedSample.emsFailureLogs + observedSample.emsErrorLogs)
              / Math.max(1, observedSample.emsWaiterLogs + observedSample.emsCreateSubEngineLogs)
              * 30
          );
          cheapRate += gaussian(t, 54, 15) * intensity * (1.7 + Math.min(0.5, waiterPressure - 1));
          cheapRate += gaussian(t, 118, 18) * intensity * 0.72;
          heavyRate += gaussian(t, 74, 20) * intensity * (0.72 + Math.min(0.35, churnPressure - 1));
          heavyRate += gaussian(t, 112, 17) * intensity * (0.42 + failurePressure * 0.16);
        } else if (scenario === &quot;dashboard&quot;) {
          cheapRate += gaussian(t, 62, 13) * intensity * 3.2;
          heavyRate += gaussian(t, 72, 18) * intensity * 0.22;
        } else if (scenario === &quot;etl&quot;) {
          cheapRate += gaussian(t, 66, 16) * intensity * 1.2;
          heavyRate += gaussian(t, 58, 20) * intensity * 0.82;
        } else if (scenario === &quot;joins&quot;) {
          cheapRate += gaussian(t, 62, 20) * intensity * 0.35;
          heavyRate += gaussian(t, 62, 17) * intensity * 1.38;
        } else {
          cheapRate += gaussian(t, 48, 11) * intensity * 2.8;
          heavyRate += gaussian(t, 112, 12) * intensity * 1.08;
        }
        const cheapCount = countFromRate(cheapRate, t * 17 + 3);
        const heavyCount = countFromRate(heavyRate, t * 19 + 5);
        for (let i = 0; i &lt; cheapCount; i++) {
          workload[t].push(makeQuery(id++, t, &quot;cheap&quot;, scenario));
        }
        for (let i = 0; i &lt; heavyCount; i++) {
          workload[t].push(makeQuery(id++, t, &quot;heavy&quot;, scenario));
        }
      }
      return workload;
    }

    function percentile(values, p) {
      if (!values.length) {
        return 0;
      }
      const sorted = values.slice().sort((a, b) =&gt; a - b);
      const idx = Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p));
      return sorted[idx];
    }

    function simulateMode(mode, workload, settings) {
      let replicas = 1;
      let lastScaleAt = -999;
      let prewarmDone = false;
      let completed = 0;
      let failed = 0;
      let idleReplicaSeconds = 0;
      let failedWorkSeconds = 0;
      const running = [];
      const waitQueue = [];
      const pending = [];
      const waitTimes = [];
      const visibleWaitTimes = [];
      const series = [];
      const modeSlotsPerReplica = mode === &quot;learned_ai&quot; ? Math.ceil(slotsPerReplica * 1.25) : slotsPerReplica;
      const modeMemPerReplica = mode === &quot;learned_ai&quot; ? memPerReplica * 1.55 : memPerReplica;
      const modeReplicaCost = mode === &quot;learned_ai&quot; ? 1.28 : 1;

      function activeAndPending() {
        return replicas + pending.length;
      }

      function scheduleReplica(t, count, reason) {
        let remaining = Math.min(count, settings.maxReplicas - activeAndPending());
        const spacing = reason === &quot;forecast&quot; ? 1 : 3;
        while (remaining &gt; 0) {
          pending.push({ readyAt: t + settings.startup + (count - remaining) * spacing, reason });
          remaining--;
        }
        if (count &gt; 0) {
          lastScaleAt = t;
        }
      }

      function scheduleForecastReplicas(meta, desired) {
        let remaining = Math.min(desired - activeAndPending(), settings.maxReplicas - activeAndPending());
        let offset = 0;
        const readyBase = Math.max(0, meta.peak - meta.readyBeforePeak);
        while (remaining &gt; 0) {
          const readyAt = readyBase + offset;
          if (readyAt &lt;= 0) {
            replicas++;
          } else {
            pending.push({ readyAt, reason: &quot;forecast&quot; });
          }
          remaining--;
          offset++;
        }
        prewarmDone = true;
        lastScaleAt = readyBase - settings.startup;
      }

      function runningMemory() {
        return running.reduce((sum, q) =&gt; sum + q.memory, 0);
      }

      function canFit(query) {
        return running.length &lt; replicas * modeSlotsPerReplica
          &amp;&amp; runningMemory() + query.memory &lt;= replicas * modeMemPerReplica;
      }

      function selectIndex(t) {
        const aiMode = mode === &quot;cold_ai&quot; || mode === &quot;learned_ai&quot;;
        if (!aiMode) {
          return 0;
        }
        if (mode === &quot;learned_ai&quot;) {
          const oldHeavy = waitQueue.findIndex(q =&gt; q.kind === &quot;heavy&quot; &amp;&amp; t - q.arrival &gt;= 24 &amp;&amp; canFit(q));
          if (oldHeavy &gt;= 0) {
            return oldHeavy;
          }
        }
        const cheapFit = waitQueue.findIndex(q =&gt; q.kind === &quot;cheap&quot; &amp;&amp; canFit(q));
        if (cheapFit &gt;= 0) {
          return cheapFit;
        }
        const anyFit = waitQueue.findIndex(q =&gt; canFit(q));
        return anyFit &gt;= 0 ? anyFit : 0;
      }

      for (let t = 0; t &lt;= totalSeconds; t++) {
        for (let i = running.length - 1; i &gt;= 0; i--) {
          if (running[i].endAt &lt;= t) {
            running.splice(i, 1);
            completed++;
          }
        }
        for (let i = pending.length - 1; i &gt;= 0; i--) {
          if (pending[i].readyAt &lt;= t) {
            pending.splice(i, 1);
            replicas++;
          }
        }

        for (const query of workload[t]) {
          waitQueue.push({ ...query, breached: false, waitRecorded: false });
        }

        if (mode === &quot;learned_ai&quot;) {
          const meta = scenarioMeta[settings.scenario];
          const desired = Math.min(settings.maxReplicas, Math.max(1, Math.ceil(meta.aiNeed * settings.intensity * 1.18)));
          const latestStart = meta.peak - meta.readyBeforePeak - settings.startup;
          if (!prewarmDone &amp;&amp; latestStart &lt; 0) {
            scheduleForecastReplicas(meta, desired);
          } else if (!prewarmDone &amp;&amp; t &gt;= latestStart) {
            scheduleReplica(t, Math.max(0, desired - activeAndPending()), &quot;forecast&quot;);
            prewarmDone = true;
          }
          if (waitQueue.length &gt; modeSlotsPerReplica &amp;&amp; activeAndPending() &lt; settings.maxReplicas &amp;&amp; t - lastScaleAt &gt; 10) {
            scheduleReplica(t, 1, &quot;fallback&quot;);
          }
        } else if (mode === &quot;cold_ai&quot;) {
          const heavyWaiters = waitQueue.filter(query =&gt; query.kind === &quot;heavy&quot;).length;
          const livePressure = waitQueue.length &gt; Math.max(6, slotsPerReplica * 0.95);
          const riskyShape = heavyWaiters &gt;= Math.max(3, slotsPerReplica * 0.38);
          if ((livePressure || riskyShape)
            &amp;&amp; activeAndPending() &lt; settings.maxReplicas
            &amp;&amp; t - lastScaleAt &gt; Math.max(9, settings.startup * 0.42)) {
            scheduleReplica(t, 1, &quot;global-prior&quot;);
          }
        } else if (mode === &quot;reactive&quot;) {
          if (waitQueue.length &gt; Math.max(3, slotsPerReplica * 0.6)
            &amp;&amp; activeAndPending() &lt; settings.maxReplicas
            &amp;&amp; t - lastScaleAt &gt; Math.max(9, settings.startup * 0.45)) {
            scheduleReplica(t, 1, &quot;waiters&quot;);
          }
        }

        for (const query of waitQueue) {
          if (mode !== &quot;static&quot; &amp;&amp; !query.breached &amp;&amp; t - query.arrival &gt; maxWaitSeconds) {
            query.breached = true;
            if (!query.waitRecorded) {
              visibleWaitTimes.push(maxWaitSeconds);
              query.waitRecorded = true;
            }
            failed++;
          }
        }

        let guard = 0;
        while (waitQueue.length &amp;&amp; running.length &lt; replicas * modeSlotsPerReplica &amp;&amp; guard++ &lt; 200) {
          const idx = selectIndex(t);
          const query = waitQueue[idx];
          if (!canFit(query)) {
            if (mode === &quot;static&quot;) {
              waitQueue.splice(idx, 1);
              failed++;
              failedWorkSeconds += Math.max(4, query.duration * 0.25);
              continue;
            }
            break;
          }
          waitQueue.splice(idx, 1);
          if (!query.waitRecorded) {
            visibleWaitTimes.push(t - query.arrival);
            query.waitRecorded = true;
          }
          if (!query.breached) {
            waitTimes.push(t - query.arrival);
          }
          running.push({ ...query, endAt: t + query.duration });
        }

        if (mode === &quot;static&quot; &amp;&amp; waitQueue.length) {
          for (const query of waitQueue) {
            failed++;
            if (!query.waitRecorded) {
              visibleWaitTimes.push(0);
              query.waitRecorded = true;
            }
            if (query.kind === &quot;heavy&quot;) {
              failedWorkSeconds += Math.max(4, query.duration * 0.22);
            }
          }
          waitQueue.length = 0;
        }

        idleReplicaSeconds += Math.max(0, replicas * modeSlotsPerReplica - running.length) / modeSlotsPerReplica * modeReplicaCost;
        series.push({
          t,
          replicas,
          pending: pending.length,
          running: running.length,
          waiters: waitQueue.length,
          failed,
          completed,
          memory: runningMemory()
        });
      }

      return {
        mode,
        series,
        metrics: {
          completed,
          failed,
          endWaiters: waitQueue.length,
          p95Wait: percentile(visibleWaitTimes, 0.95),
          p99Wait: percentile(visibleWaitTimes, 0.99),
          avgWait: visibleWaitTimes.length ? visibleWaitTimes.reduce((a, b) =&gt; a + b, 0) / visibleWaitTimes.length : 0,
          admittedP95Wait: percentile(waitTimes, 0.95),
          visibleCount: visibleWaitTimes.length,
          wasted: idleReplicaSeconds + failedWorkSeconds / slotsPerReplica
        }
      };
    }

    function simulate() {
      const settings = {
        scenario: controls.scenario.value,
        intensity: Number(controls.intensity.value),
        startup: Number(controls.startup.value),
        maxReplicas: Number(controls.maxReplicas.value)
      };
      const workload = generateWorkload(settings.scenario, settings.intensity);
      return {
        settings,
        workload,
        runs: modes.map(mode =&gt; simulateMode(mode.key, workload, settings))
      };
    }

    function pathFromPoints(points) {
      return points.map((p, i) =&gt; `${i === 0 ? &quot;M&quot; : &quot;L&quot;} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(&quot; &quot;);
    }

    function areaFromPoints(points, baseline) {
      if (!points.length) {
        return &quot;&quot;;
      }
      const forward = points.map((p, i) =&gt; `${i === 0 ? &quot;M&quot; : &quot;L&quot;} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(&quot; &quot;);
      const last = points[points.length - 1][0].toFixed(1);
      const first = points[0][0].toFixed(1);
      return `${forward} L ${last} ${baseline.toFixed(1)} L ${first} ${baseline.toFixed(1)} Z`;
    }

    function stepPath(points) {
      if (!points.length) {
        return &quot;&quot;;
      }
      let d = `M ${points[0][0].toFixed(1)} ${points[0][1].toFixed(1)}`;
      for (let i = 1; i &lt; points.length; i++) {
        d += ` H ${points[i][0].toFixed(1)} V ${points[i][1].toFixed(1)}`;
      }
      return d;
    }

    function svgEl(name, attrs = {}) {
      const el = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, name);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }
      return el;
    }

    function addText(parent, text, x, y, attrs = {}) {
      const el = svgEl(&quot;text&quot;, { x, y, ...attrs });
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function draw() {
      if (!model) {
        return;
      }

      const width = Math.max(360, Math.round(root.getBoundingClientRect().width || 740));
      const top = 24;
      const rowHeight = 104;
      const rowGap = 18;
      const plotBottom = top + modes.length * rowHeight + (modes.length - 1) * rowGap;
      const height = plotBottom + 36;
      const left = width &lt; 480 ? 118 : 136;
      const right = 18;
      const plotWidth = width - left - right;
      const x = t =&gt; left + (t / totalSeconds) * plotWidth;
      const maxWaiters = Math.max(
        1,
        ...model.runs.flatMap(run =&gt; run.series.map(point =&gt; point.waiters))
      );
      const maxRunning = Math.max(
        slotsPerReplica,
        ...model.runs.flatMap(run =&gt; run.series.map(point =&gt; point.running))
      );

      svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
      svg.setAttribute(&quot;height&quot;, height);
      svg.innerHTML = &quot;&quot;;

      const defs = svgEl(&quot;defs&quot;);
      defs.innerHTML = `
        &lt;clipPath id=&quot;ai-wlm-frame-clip&quot;&gt;
          &lt;rect x=&quot;${left}&quot; y=&quot;${top - 2}&quot; width=&quot;${plotWidth}&quot; height=&quot;${plotBottom - top + 8}&quot;&gt;&lt;/rect&gt;
        &lt;/clipPath&gt;
      `;
      svg.appendChild(defs);

      addText(svg, &quot;time (seconds)&quot;, left + plotWidth / 2, height - 8, {
        &quot;text-anchor&quot;: &quot;middle&quot;,
        class: &quot;axis-title&quot;
      });

      for (let tick = 0; tick &lt;= totalSeconds; tick += 30) {
        const tx = x(tick);
        svg.appendChild(svgEl(&quot;line&quot;, {
          x1: tx,
          x2: tx,
          y1: top - 4,
          y2: plotBottom + 6,
          stroke: &quot;var(--border)&quot;,
          &quot;stroke-width&quot;: &quot;1&quot;
        }));
        addText(svg, String(tick), tx, plotBottom + 22, {
          &quot;text-anchor&quot;: &quot;middle&quot;,
          class: &quot;muted&quot;
        });
      }

      model.runs.forEach((run, rowIndex) =&gt; {
        const y0 = top + rowIndex * (rowHeight + rowGap);
        const frameHeight = 70;
        const base = y0 + frameHeight;
        const yWait = value =&gt; base - Math.min(1, value / maxWaiters) * (frameHeight - 10);
        const yReplicas = value =&gt; base - Math.min(1, value / model.settings.maxReplicas) * (frameHeight - 10);
        const yRunning = value =&gt; base - Math.min(1, value / maxRunning) * (frameHeight - 10);

        addText(svg, modes[rowIndex].label, 8, y0 + 14, {
          &quot;font-weight&quot;: &quot;700&quot;
        });
        addText(svg, modes[rowIndex].note, 8, y0 + 30, {
          class: &quot;muted&quot;
        });
        addText(svg, `p95/p99 ${Math.round(run.metrics.p95Wait)}/${Math.round(run.metrics.p99Wait)}s`, 8, y0 + 48, {
          class: &quot;muted&quot;
        });
        const breachPct = run.metrics.visibleCount
          ? Math.round((run.metrics.failed / run.metrics.visibleCount) * 100)
          : 0;
        const breachLabel = run.mode === &quot;static&quot; ? &quot;fail/SLO&quot; : &quot;SLO breach&quot;;
        addText(svg, `${breachLabel} ${run.metrics.failed} (${breachPct}%)`, 8, y0 + 64, {
          class: &quot;muted&quot;
        });
        addText(svg, `waiting @180s ${run.metrics.endWaiters}`, 8, y0 + 80, {
          class: &quot;muted&quot;
        });
        addText(svg, `waste ${Math.round(run.metrics.wasted)}`, 8, y0 + 96, {
          class: &quot;muted&quot;
        });

        svg.appendChild(svgEl(&quot;rect&quot;, {
          x: left,
          y: y0,
          width: plotWidth,
          height: frameHeight,
          fill: &quot;transparent&quot;,
          stroke: &quot;var(--border)&quot;,
          &quot;stroke-width&quot;: &quot;1&quot;,
          &quot;data-chart-frame&quot;: &quot;true&quot;
        }));

        const waitPoints = run.series.map(point =&gt; [x(point.t), yWait(point.waiters)]);
        const runningPoints = run.series.map(point =&gt; [x(point.t), yRunning(point.running)]);
        const replicaPoints = run.series.map(point =&gt; [x(point.t), yReplicas(point.replicas)]);

        svg.appendChild(svgEl(&quot;path&quot;, {
          d: areaFromPoints(waitPoints, base),
          fill: &quot;var(--viz-series-1)&quot;,
          opacity: &quot;0.14&quot;
        }));
        svg.appendChild(svgEl(&quot;path&quot;, {
          d: pathFromPoints(waitPoints),
          fill: &quot;none&quot;,
          stroke: &quot;var(--viz-series-1)&quot;,
          &quot;stroke-width&quot;: &quot;2&quot;
        }));
        svg.appendChild(svgEl(&quot;path&quot;, {
          d: pathFromPoints(runningPoints),
          fill: &quot;none&quot;,
          stroke: &quot;var(--viz-series-3)&quot;,
          &quot;stroke-width&quot;: &quot;1.5&quot;,
          opacity: &quot;0.74&quot;
        }));
        svg.appendChild(svgEl(&quot;path&quot;, {
          d: stepPath(replicaPoints),
          fill: &quot;none&quot;,
          stroke: &quot;var(--viz-series-2)&quot;,
          &quot;stroke-width&quot;: &quot;2.4&quot;
        }));

        let previousFailures = 0;
        for (const point of run.series) {
          const delta = point.failed - previousFailures;
          previousFailures = point.failed;
          if (delta &lt;= 0) {
            continue;
          }
          svg.appendChild(svgEl(&quot;circle&quot;, {
            cx: x(point.t),
            cy: base - 4,
            r: Math.min(7, 2.5 + delta),
            fill: &quot;var(--viz-series-4)&quot;,
            opacity: &quot;0.86&quot;
          }));
        }
      });

      const cursorX = x(currentSecond);
      svg.appendChild(svgEl(&quot;line&quot;, {
        x1: cursorX,
        x2: cursorX,
        y1: top - 8,
        y2: plotBottom + 8,
        stroke: &quot;var(--viz-series-5)&quot;,
        &quot;stroke-width&quot;: &quot;2&quot;,
        &quot;stroke-dasharray&quot;: &quot;4 4&quot;
      }));
      addText(svg, `${currentSecond}s`, Math.min(width - 18, cursorX + 5), top - 10, {
        class: &quot;muted&quot;
      });

      updateDetail();
    }

    function updateDetail() {
      const point = key =&gt; {
        const run = model.runs.find(item =&gt; item.mode === key);
        return run.series[Math.min(currentSecond, run.series.length - 1)];
      };
      const staticPoint = point(&quot;static&quot;);
      const reactivePoint = point(&quot;reactive&quot;);
      const coldAiPoint = point(&quot;cold_ai&quot;);
      const learnedAiPoint = point(&quot;learned_ai&quot;);
      detail.textContent =
        `At ${currentSecond}s: no DLL has ${staticPoint.failed} fail-fast or SLO-breached queries; reactive DLL has ${reactivePoint.waiters} waiting and ${reactivePoint.failed} SLO breaches; global-prior AI has ${coldAiPoint.waiters} waiting and ${coldAiPoint.failed} SLO breaches; local-learning AI has ${learnedAiPoint.waiters} waiting, ${learnedAiPoint.failed} SLO breaches, and ${learnedAiPoint.replicas} replicas.`;
    }

    function formatCompact(value) {
      return new Intl.NumberFormat(&quot;en&quot;, { notation: &quot;compact&quot;, maximumFractionDigits: 1 }).format(value);
    }

    function updateCalibrationText() {
      if (controls.scenario.value === &quot;observe&quot;) {
        outputs.sourceNote.textContent = &quot;Observed DaaS signal counts and replica-create latency normalized into the same 180s model&quot;;
        calibration.textContent =
          `${observedSample.window}: ${formatCompact(observedSample.emsWaiterLogs)} waiter, ${formatCompact(observedSample.emsCreateSubEngineLogs)} create-sub-engine, ${formatCompact(observedSample.emsDeleteSubEngineLogs)} delete-sub-engine lines. ${observedSample.startupWindow}: ${formatCompact(observedSample.startupStarts)} total, p50/p95/p99 ${observedSample.startupP50Seconds}/${observedSample.startupP95Seconds}/${observedSample.startupP99Seconds}s. Demand additional scale-up: ${formatCompact(observedSample.demandScaleCreates)}, ${observedSample.demandScaleP50Seconds}/${observedSample.demandScaleP95Seconds}/${observedSample.demandScaleP99Seconds}s; non-demand/min/other: ${formatCompact(observedSample.otherCreates)}, ${observedSample.otherP50Seconds}/${observedSample.otherP95Seconds}/${observedSample.otherP99Seconds}s. DLL rows treat overload as wait-SLO breach, not hard query failure. Waiting @180s is unserved work inside this bounded window; increase allowed replicas to test Cloud capacity-policy headroom. Global-prior AI is conservative; wait improvement on similar replicas assumes an admission/routing hook, otherwise it should track Reactive. Local-learning AI assumes recurring workload evidence can pre-warm before the chart window and route known risky shapes to a historically successful capacity class. Use 5x-8x for high adoption and 10x-20x for SAP stress.`;
      } else {
        outputs.sourceNote.textContent = &quot;Synthetic workload for comparing admission strategies&quot;;
        calibration.textContent = &quot;Synthetic preset: DLL rows treat overload as wait-SLO breach, not hard query failure. Waiting @180s is unserved work inside this bounded window; increase allowed replicas to test Cloud capacity-policy headroom. Global-prior AI is conservative; wait improvement on similar replicas assumes an admission/routing hook, otherwise it should track Reactive. Local-learning AI assumes recurring workload evidence can pre-warm before the chart window and route known risky shapes to a historically successful capacity class. Extreme load plus slow replica create will still show tail wait when forecast horizon is shorter than create-to-useful-capacity time.&quot;;
      }
    }

    function recompute() {
      outputs.intensity.textContent = `${Number(controls.intensity.value).toFixed(1)}x`;
      outputs.startup.textContent = `${controls.startup.value}s`;
      outputs.maxReplicas.textContent = controls.maxReplicas.value;
      updateCalibrationText();
      model = simulate();
      currentSecond = Math.min(currentSecond, totalSeconds);
      draw();
    }

    function tick() {
      if (!playing) {
        return;
      }
      currentSecond = currentSecond &gt;= totalSeconds ? 0 : currentSecond + 1;
      draw();
    }

    controls.scenario.addEventListener(&quot;change&quot;, () =&gt; {
      currentSecond = 0;
      recompute();
    });
    controls.intensity.addEventListener(&quot;input&quot;, recompute);
    controls.startup.addEventListener(&quot;input&quot;, recompute);
    controls.maxReplicas.addEventListener(&quot;input&quot;, recompute);
    controls.play.addEventListener(&quot;click&quot;, () =&gt; {
      playing = !playing;
      controls.play.textContent = playing ? &quot;Pause&quot; : &quot;Run&quot;;
      controls.play.setAttribute(&quot;aria-pressed&quot;, String(playing));
    });

    new ResizeObserver(draw).observe(root);
    recompute();
    timer = setInterval(tick, 130);
    root.addEventListener(&quot;DOMNodeRemoved&quot;, () =&gt; {
      if (timer) {
        clearInterval(timer);
      }
    }, { once: true });
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
